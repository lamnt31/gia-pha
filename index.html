<script>/* áp giao diện đã chọn ngay khi tải để không nháy màu; mặc định: sáng */
try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('theme')) === 'dark' ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
try { var fz = +JSON.parse(localStorage.getItem('fontSize')); if (fz >= 11 && fz <= 16) document.documentElement.style.setProperty('--font-size', fz + 'px'); } catch (e) {}
/* bắt sự kiện "sẵn sàng cài" thật sớm – trình duyệt có thể bắn trước khi app.js (tải sau Firebase) chạy */
addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__bip = e; });
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Gia phả</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* ===== Nền tảng (giống app Quản lý thẻ) ===== */
  :root {
    --font-size: 13px;   /* như ech-client */
    --fs-xs: calc(var(--font-size) - 2px); --fs-sm: calc(var(--font-size) - 1px); --fs-base: var(--font-size); --fs-md: calc(var(--font-size) + 1px);
    --fs-lg: calc(var(--font-size) + 2px); --fs-xl: calc(var(--font-size) + 3px); --fs-2xl: calc(var(--font-size) + 5px);
    --bg: #eef1f5; --bg2: #e4e8ee; --card: rgba(255,255,255,.8); --card-solid: #fff; --text: #111827; --muted: #6b7280;
    --line: rgba(17,24,39,.08); --accent: #0070f4; --accent2: #2f8bff; --ring: rgba(0,112,244,.14); --hdr: #0070f4; --tabgrey: #b0b8c1;
    --ok: #059669; --warn: #d97706; --bad: #dc2626; --warn-bg: rgba(245,158,11,.12); --bad-bg: rgba(220,38,38,.1); --ok-bg: rgba(5,150,105,.1);
    --shadow: 0 1px 2px rgba(17,24,39,.04), 0 8px 24px -12px rgba(17,24,39,.18);
    --shadow-hover: 0 2px 4px rgba(17,24,39,.06), 0 18px 40px -16px rgba(0,112,244,.4);
    --blob1: rgba(0,112,244,.10); --blob2: rgba(14,165,233,.08); --blob3: rgba(0,112,244,.06);
    --male: #2563eb; --male-bg: #eff6ff; --female: #db2777; --female-bg: #fdf2f8; --link: #94a3b8;
  }
  :root[data-theme="dark"] {
    --bg: #0b0f19; --bg2: #0f1424; --card: rgba(23,28,45,.75); --card-solid: #171c2d; --text: #e5e7eb; --muted: #9ca3af;
    --line: rgba(255,255,255,.08); --accent: #4d9bff; --accent2: #79b4ff; --ring: rgba(77,155,255,.2); --hdr: #0b2a55; --tabgrey: #6b7785;
    --ok: #34d399; --warn: #fbbf24; --bad: #f87171; --warn-bg: rgba(251,191,36,.12); --bad-bg: rgba(248,113,113,.12); --ok-bg: rgba(52,211,153,.12);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6); --shadow-hover: 0 18px 40px -16px rgba(77,155,255,.4);
    --blob1: rgba(0,112,244,.12); --blob2: rgba(14,165,233,.06); --blob3: rgba(0,112,244,.06);
    --male: #60a5fa; --male-bg: #13213d; --female: #f472b6; --female-bg: #33172a; --link: #475569;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { overflow-x: hidden; }
  html, body { margin: 0; min-height: 100%; color: var(--text); background: var(--bg);
    font: var(--font-size)/1.5 "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body::before { content: ""; position: fixed; inset: -20vmax; z-index: -1; pointer-events: none;
    background: radial-gradient(40vmax 40vmax at 15% 10%, var(--blob1), transparent 60%), radial-gradient(35vmax 35vmax at 90% 0%, var(--blob2), transparent 60%),
                radial-gradient(40vmax 40vmax at 70% 90%, var(--blob3), transparent 60%), var(--bg); }
  [hidden] { display: none !important; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
  .hero { display: flex; align-items: flex-start; gap: 12px; }
  .hero .hi { flex: 1; min-width: 0; }
  .hero h1 { margin: 0 0 2px; font-size: clamp(26px, 6vw, 34px); font-weight: 800; letter-spacing: -.02em; }
  .hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2), #ec4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 0; color: var(--muted); font-size: var(--fs-md); }
  .acts { display: flex; gap: 8px; }
  .ibtn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); text-decoration: none; flex: 0 0 auto;
          background: var(--card); color: var(--text); cursor: pointer; font-size: 16px; backdrop-filter: blur(10px); transition: .15s; }
  .ibtn:hover { color: var(--accent); border-color: var(--ring); }
  .sec { display: flex; align-items: center; gap: 8px; margin: 28px 2px 12px; font-size: var(--fs-base); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .sec .n { margin-left: auto; font-weight: 600; text-transform: none; letter-spacing: 0; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); backdrop-filter: blur(12px); overflow: hidden; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item .ic { flex: 0 0 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: var(--fs-md); overflow: hidden; }
  .item .ic img { width: 100%; height: 100%; object-fit: cover; }
  .ic.bad { background: var(--bad-bg); color: var(--bad); } .ic.warn { background: var(--warn-bg); color: var(--warn); }
  .ic.ok { background: var(--ok-bg); color: var(--ok); } .ic.info { background: var(--ring); color: var(--accent); }
  .ic.m { background: var(--male-bg); color: var(--male); } .ic.f { background: var(--female-bg); color: var(--female); }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; font-size: var(--fs-md); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .t span { display: block; font-size: var(--fs-base); color: var(--muted); }
  .item .when { font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; padding: 3px 9px; border-radius: 99px; }
  .when.bad { background: var(--bad-bg); color: var(--bad); } .when.warn { background: var(--warn-bg); color: var(--warn); } .when.ok { background: var(--ok-bg); color: var(--ok); }
  .when.info { background: var(--ring); color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 50px 16px; }
  .empty i { font-size: 34px; display: block; margin-bottom: 10px; opacity: .6; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: var(--fs-base); font-weight: 600;
          padding: 7px 13px; border-radius: 99px; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; }
  .filters::-webkit-scrollbar { display: none; }
  @media (min-width: 600px) { .filters { flex-wrap: wrap; overflow: visible; } }
  .filters .chip i { font-size: .85em; }
  .lcount { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 2px 6px; font-size: var(--fs-sm); color: var(--muted); }
  .lcount b { color: var(--text); }
  .search { position: relative; flex: 1; min-width: 160px; }
  .search > i { position: absolute; z-index: 1; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
  .search input { width: 100%; font: inherit; font-size: var(--fs-base); padding: 8px 38px 8px 34px; border-radius: 99px; border: 1px solid var(--line);
                  background: var(--card-solid); color: var(--text); outline: none; }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .search .clr { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; border: 0;
                 background: var(--line); color: var(--muted); cursor: pointer; display: grid; place-items: center; font-size: var(--fs-sm); }
  .listbar { position: sticky; top: 52px; z-index: 6; margin: 0 -16px; padding: 10px 16px 6px; background: var(--bg); display: flex; flex-direction: column; gap: 8px; }

  /* ===== Popup, hộp thoại, thông báo ===== */
  .sheet-bg { position: fixed; inset: 0; background: rgba(8,10,20,.62); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); z-index: 50; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--card-solid); border-radius: 22px 22px 0 0; max-width: none; margin: 0;
           max-height: calc(var(--vvh, 1vh) * 88); overflow: auto; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); transform: translateY(110%); transition: transform .22s; }
  .sheet.open { transform: none; } .sheet-bg.open { display: block; }
  .sheet.fixh { height: calc(var(--vvh, 1vh) * 88); }
  .sheet, .modal { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .sheet-bg, .modal, .busy { touch-action: none; }
  body.locked { position: fixed; left: 0; right: 0; overflow: hidden; }
  * { scrollbar-width: thin; scrollbar-color: rgba(127,127,127,.35) transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(127,127,127,.35); border-radius: 99px; }
  @media (min-width: 900px) {
    .sheet { left: auto; right: 0; top: 0; bottom: 0; margin: 0; width: 460px; max-width: 92vw; max-height: none; height: calc(var(--vvh, 1vh) * 100);
             border-radius: 22px 0 0 22px; padding: 22px; transform: translateX(105%); transition: transform .25s ease; box-shadow: -18px 0 40px -20px rgba(0,0,0,.35); }
    .sheet.open { transform: none; }
    .sheet .grab { display: none; }
    .sheet .fbar { bottom: -22px; margin: 18px -22px -22px; padding: 14px 22px; border-radius: 0 0 0 22px; }
  }
  .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 14px; }
  .rows { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-top: 12px; }
  .r { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: var(--fs-base); }
  .r:first-child { border-top: 0; }
  .r > i { width: 18px; text-align: center; color: var(--muted); }
  .r > span { color: var(--muted); flex: 0 0 auto; }
  .r > b { margin-left: auto; font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }
  .r b small { display: block; font-weight: 500; color: var(--muted); font-size: var(--fs-sm); }
  .sacts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .sacts .full { grid-column: 1 / -1; }
  .abtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border-radius: 12px; font: inherit; font-weight: 700; padding: 0 14px;
          text-decoration: none; cursor: pointer; border: 1px solid var(--line); background: var(--card-solid); color: var(--text); }
  .abtn.blue { border: 0; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .abtn.red { color: var(--bad); }
  .abtn.sm { height: 32px; font-size: var(--fs-base); padding: 0 12px; border-radius: 11px; }
  .abtn:disabled { opacity: .5; }
  .busy { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(0,0,0,.35); }
  .busy > div { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 16px; background: var(--card-solid); font-weight: 600; box-shadow: var(--shadow-hover); }
  .busy i { font-size: 22px; color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: #111827; color: #fff; max-width: calc(100vw - 32px);
           padding: 10px 18px; border-radius: 18px; font-size: var(--fs-md); opacity: 0; transition: .25s; pointer-events: none; z-index: 90; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* Hộp thoại & danh sách chọn: trượt lên từ đáy (điện thoại), khung bên phải (máy tính) – giống form Thêm người */
  .modal { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; background: rgba(8,10,20,.62);
           -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
  .modal.picker { z-index: 85; }
  .mbox { width: 100%; max-width: none; max-height: calc(var(--vvh, 1vh) * 88); overflow: auto; touch-action: pan-y; background: var(--card-solid); border-radius: 22px 22px 0 0;
          padding: 10px 18px calc(16px + env(safe-area-inset-bottom)); box-shadow: var(--shadow-hover); animation: sheetUp .22s ease both; }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  @keyframes sheetIn { from { transform: translateX(100%); } }
  @media (min-width: 900px) {
    .modal { justify-content: flex-end; align-items: stretch; }
    .mbox { width: 460px; max-width: 92vw; max-height: none; height: calc(var(--vvh, 1vh) * 100); border-radius: 22px 0 0 22px; padding: 22px; animation-name: sheetIn; }
    .mbox .grab { display: none; }
  }
  .mbox h3 { margin: 0 0 6px; font-size: var(--fs-2xl); }
  .mbox p { margin: 0 0 12px; font-size: var(--fs-base); color: var(--muted); }
  .mbox .fld { margin-top: 8px; }
  .merr { color: var(--bad); font-size: var(--fs-base); min-height: 18px; margin-top: 6px; }
  .macts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .macts.one { grid-template-columns: 1fr; }
  .pklist { display: flex; flex-direction: column; margin: 6px -6px 0; }
  /* danh sách dài (có ô tìm): popup cố định chiều cao, chỉ phần danh sách cuộn → lọc không làm popup co lại */
  .mbox.tallbox { height: calc(var(--vvh, 1vh) * 82); display: flex; flex-direction: column; overflow: hidden; }
  .mbox.tallbox .pklist { flex: 1; min-height: 0; overflow-y: auto; justify-content: flex-start; }
  .mbox.tallbox > :not(.pklist) { flex: 0 0 auto; }   /* ô tìm (.search có flex:1 cho hàng ngang) không được giãn dọc */
  .sheet.fixh .search { flex: 0 0 auto; }
  @media (min-width: 900px) { .mbox.tallbox { height: calc(var(--vvh, 1vh) * 100); } }
  .pplist .item { cursor: pointer; }
  .pplist input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: 0 0 auto; }
  .pkopt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 12px; border: 0; border-radius: 12px; background: none;
           color: var(--text); font: inherit; font-size: var(--fs-md); text-align: left; cursor: pointer; border-bottom: 1px solid var(--line); }
  .pkopt:last-child { border-bottom: 0; }
  .pkopt.on { color: var(--accent); font-weight: 700; background: var(--ring); }
  .pkopt:hover { background: var(--bg); }
  .pks { margin: 6px 0 4px; }
  .selhide { display: none !important; }
  .selbtn { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; text-align: left; font: inherit; color: var(--text); }
  .selbtn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .selbtn i { font-size: var(--fs-xs); color: var(--muted); }
  .fld .selbtn { width: 100%; font-size: var(--fs-base); padding: 9px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
  .selbtn:disabled { opacity: .6; cursor: default; }

  /* ===== Form ===== */
  .fsec { margin-top: 18px; font-size: var(--fs-sm); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 6px; }
  .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .fgrid .full { grid-column: 1 / -1; }
  .fld label { display: block; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .fld input, .fld select, .fld textarea { width: 100%; font: inherit; font-size: var(--fs-base); padding: 9px 11px; border-radius: 12px; border: 1px solid var(--line);
                            background: var(--bg); color: var(--text); outline: none; }
  .fld textarea { min-height: 76px; resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .fld .hint { font-size: var(--fs-sm); margin-top: 3px; min-height: 16px; color: var(--muted); }
  .hint.ok { color: var(--ok); } .hint.bad { color: var(--bad); }
  .ck { display: flex; align-items: center; gap: 8px; font-size: var(--fs-md); cursor: pointer; padding: 6px 0; }
  .ck input { width: 18px; height: 18px; accent-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg label { flex: 1; text-align: center; padding: 9px 6px; cursor: pointer; font-size: var(--fs-md); font-weight: 600; color: var(--muted); }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: var(--ring); color: var(--accent); }
  .fbar { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); margin: 16px -18px calc(-18px - env(safe-area-inset-bottom)); z-index: 2;
          padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); background: var(--card-solid); border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .fbar .abtn { flex: 1; }
  .phw { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .ph { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; font-weight: 700; overflow: hidden; flex: 0 0 auto; }
  .ph img { width: 100%; height: 100%; object-fit: cover; }
  .ph.m { background: var(--male-bg); color: var(--male); } .ph.f { background: var(--female-bg); color: var(--female); }

  /* ===== Đăng nhập / đăng ký (giống ech-client) ===== */
  .gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 40; overflow: auto;
          background: linear-gradient(180deg, var(--hdr) 0, var(--hdr) 34%, var(--bg) 34%); }
  .gbox { width: 100%; max-width: 380px; text-align: center; padding: 30px 22px 22px; border-radius: 24px; background: var(--card-solid); position: relative;
          border: 1px solid var(--line); box-shadow: var(--shadow-hover); }
  .gbox.wide { max-width: 520px; }
  .lock { width: 64px; height: 64px; margin: 0 auto; border-radius: 20px; display: grid; place-items: center; color: #fff; font-size: 26px;
          background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 14px 30px -12px var(--accent); }
  .gt { margin: 14px 0 4px; font-size: calc(var(--font-size) + 7px); font-weight: 800; }
  .gclan { margin: 0 0 14px; color: var(--accent); font-weight: 700; font-size: var(--fs-md); }
  .ghi { padding: 10px 12px 2px; border-top: 1px dashed var(--line); font-size: var(--fs-lg); }
  .ghi b { font-weight: 800; }
  .gs { margin: 0 0 18px; color: var(--muted); font-size: var(--fs-md); }
  .gbox .mav.big { width: 76px; height: 76px; margin: 0 auto; font-size: 32px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 14px 30px -12px var(--accent); }
  .gfld { position: relative; margin-bottom: 10px; }
  .gfld > i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  .gfld input { width: 100%; font: inherit; font-size: var(--fs-base); padding: 11px 44px 11px 38px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg);
                color: var(--text); outline: none; }
  .gfld input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
  .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  .grow { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 12px; }
  .grow .ck { font-size: var(--fs-base); color: var(--muted); }
  .linkbtn { border: 0; background: none; color: var(--accent); font: inherit; font-size: var(--fs-base); font-weight: 600; cursor: pointer; padding: 4px 0; }
  .go { width: 100%; height: 44px; border: 0; border-radius: 12px; cursor: pointer; font: inherit; font-size: var(--fs-md); font-weight: 700; color: #fff;
        background: var(--accent); display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
  .go:disabled { opacity: .6; }
